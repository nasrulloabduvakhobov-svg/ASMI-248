<style>
  :root{
    --shell-bg:#0c0e13;
    --shell-text:#eef1f6;
    --shell-dim:#8b93a3;
    --font-head:'PT Serif', Georgia, serif;
    --font-body:'PT Sans', Arial, sans-serif;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  button{
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    user-select:none;
    touch-action:manipulation;
    appearance:none;
    -webkit-appearance:none;
  }
  button:active{opacity:.8;}
  body{
    background:var(--shell-bg);
    color:var(--shell-text);
    font-family:var(--font-body);
    min-height:100vh;
    min-height:100dvh;
    -webkit-text-size-adjust:100%;
  }
  .app{max-width:640px;margin:0 auto;padding-bottom:calc(2rem + env(safe-area-inset-bottom));}

  header{padding:1.75rem 1.25rem .5rem;text-align:center;}
  .lang-switch{display:flex;justify-content:center;gap:.4rem;margin-bottom:1rem;}
  .lang-switch button{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.16);
    color:var(--shell-dim);
    padding:.5rem .9rem;
    border-radius:999px;
    font-family:var(--font-body);
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.04em;
    cursor:pointer;
  }
  .lang-switch button.active{background:var(--shell-text);color:var(--shell-bg);border-color:var(--shell-text);}
  header h1{
    font-family:var(--font-head);
    font-weight:700;
    font-size:1.45rem;
    line-height:1.25;
    margin:.2rem 0 .4rem;
  }
  header .subtitle{color:var(--shell-dim);font-size:.92rem;margin:0;line-height:1.4;}

  #restBanner{
    display:none;
    margin:1rem 1.25rem 0;
    padding:1rem 1.25rem;
    background:linear-gradient(135deg,#1c2333,#2a3348);
    border-radius:16px;
    text-align:center;
  }
  #restBanner strong{display:block;font-family:var(--font-head);font-size:1.05rem;margin-bottom:.3rem;}
  #restBanner p{margin:0;color:var(--shell-dim);font-size:.87rem;line-height:1.4;}

  .day-tabs{
    display:flex;
    gap:.3rem;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding:1.1rem 1.25rem 0;
    scrollbar-width:none;
  }
  .day-tabs::-webkit-scrollbar{display:none;}
  .day-tab{
    flex:0 0 auto;
    padding:.55rem 1rem;
    border-radius:10px 10px 0 0;
    border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.045);
    color:var(--tab-c,var(--shell-dim));
    font-family:var(--font-head);
    font-weight:700;
    font-size:.82rem;
    cursor:pointer;
    white-space:nowrap;
    position:relative;
  }
  .day-tab.active{background:var(--tab-c);color:#0c0e13;border-color:var(--tab-c);}
  .day-tab.is-today:not(.active)::after{
    content:'';
    position:absolute;top:-4px;right:-3px;
    width:7px;height:7px;border-radius:50%;
    background:#4ade80;
    box-shadow:0 0 0 2px var(--shell-bg);
  }

  .day-panel{
    position:relative;
    margin:0 1.25rem 1.5rem;
    padding:1.6rem 1.25rem 1.9rem;
    border-radius:0 var(--radius) var(--radius) var(--radius);
    overflow:hidden;
    color:#fff;
  }
  .panel-icon{
    position:absolute;
    top:-18px;right:-22px;
    width:170px;height:170px;
    color:var(--accent,#fff);
    opacity:.16;
    pointer-events:none;
  }
  .panel-header{position:relative;margin-bottom:1.1rem;}
  .panel-header h2{font-family:var(--font-head);font-size:1.5rem;margin:0 0 .3rem;}
  .panel-header .loc{font-size:.85rem;color:rgba(255,255,255,.78);margin:0;}

  .subjects{position:relative;display:flex;flex-wrap:wrap;gap:.7rem;margin-bottom:1.3rem;}
  .subject-card{
    flex:1 1 170px;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.2);
    border-radius:14px;
    padding:.8rem 1rem;
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
  }
  .subject-card h3{margin:0 0 .35rem;font-family:var(--font-head);font-size:1.05rem;}
  .subject-card .t1{margin:0;font-size:.87rem;color:rgba(255,255,255,.92);}
  .subject-card .t2{margin:.15rem 0 0;font-size:.78rem;color:rgba(255,255,255,.68);}

  .entry-form{
    position:relative;
    background:rgba(0,0,0,.24);
    border-radius:16px;
    padding:1rem 1rem 1.1rem;
    margin-bottom:1.3rem;
  }
  .entry-form label{
    display:block;
    font-size:.78rem;
    font-weight:700;
    color:rgba(255,255,255,.82);
    margin:.55rem 0 .3rem;
  }
  .entry-form label:first-child{margin-top:0;}
  .entry-form input[type="date"],
  .entry-form input[type="text"],
  .entry-form textarea{
    width:100%;
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.28);
    border-radius:10px;
    color:#fff;
    padding:.6rem .7rem;
    font-family:var(--font-body);
    font-size:16px;
  }
  .entry-form textarea{min-height:72px;resize:vertical;line-height:1.4;}
  .entry-form input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1);cursor:pointer;}
  .chip-row{position:relative;display:flex;gap:.5rem;margin:.8rem 0 0;flex-wrap:wrap;}
  .chip-toggle{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.28);
    color:rgba(255,255,255,.75);
    padding:.4rem .8rem;
    border-radius:999px;
    font-family:var(--font-body);
    font-size:.78rem;
    font-weight:700;
    cursor:pointer;
  }
  .chip-toggle.on{background:var(--accent,#fff);color:#0c0e13;border-color:var(--accent,#fff);}
  .chip-toggle.small{padding:.25rem .6rem;font-size:.72rem;}
  .entry-status{position:relative;display:flex;gap:.4rem;margin-top:.55rem;flex-wrap:wrap;}
  .btn-save{
    margin-top:.9rem;
    background:var(--accent,#fff);
    color:#0c0e13;
    border:none;
    font-family:var(--font-body);
    font-weight:700;
    padding:.6rem 1.5rem;
    border-radius:999px;
    cursor:pointer;
    font-size:.88rem;
  }

  .period-toggle{position:relative;display:flex;gap:.4rem;margin-bottom:1.2rem;flex-wrap:wrap;}
  .period-btn{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.24);
    color:rgba(255,255,255,.82);
    padding:.42rem .9rem;
    border-radius:999px;
    font-family:var(--font-body);
    font-size:.8rem;
    font-weight:700;
    cursor:pointer;
  }
  .period-btn.active{background:var(--accent,#fff);color:#1e1b2e;border-color:var(--accent,#fff);}
  .stats-grid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:.8rem;}
  .stat-card{
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.2);
    border-radius:16px;
    padding:1rem .9rem;
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
  }
  .stat-emoji{font-size:1.4rem;margin-bottom:.35rem;}
  .stat-label{font-size:.76rem;color:rgba(255,255,255,.8);margin-bottom:.2rem;}
  .stat-value{font-family:var(--font-head);font-size:1.6rem;font-weight:700;color:var(--accent,#fff);}
  .stat-sub{font-size:.7rem;color:rgba(255,255,255,.6);margin-top:.25rem;}
  @media (max-width:340px){
    .stats-grid{grid-template-columns:1fr;}
  }

  .history-title{position:relative;font-family:var(--font-head);font-size:1.05rem;margin:0 0 .7rem;color:rgba(255,255,255,.92);}
  .entries-list{position:relative;display:flex;flex-direction:column;gap:.6rem;}
  .entry-card{
    position:relative;
    background:rgba(0,0,0,.24);
    border-radius:12px;
    padding:.8rem 2.5rem .8rem 1rem;
    font-size:.86rem;
    line-height:1.45;
  }
  .entry-top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.4rem;}
  .entry-date{font-weight:700;color:var(--accent,#fff);font-family:var(--font-head);}
  .score-badge{background:var(--accent,#fff);color:#0c0e13;font-weight:700;font-size:.76rem;padding:.18rem .6rem;border-radius:999px;white-space:nowrap;font-family:var(--font-body);}
  .entry-field{margin-bottom:.2rem;}
  .entry-field b{color:rgba(255,255,255,.88);font-weight:700;}
  .entry-field span{color:rgba(255,255,255,.92);}
  .no-entries{position:relative;color:rgba(255,255,255,.62);font-style:italic;font-size:.86rem;margin:0;}
  .delete-btn{
    position:absolute;top:.5rem;right:.5rem;
    width:32px;height:32px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.16);
    color:#fff;
    cursor:pointer;
    font-size:1rem;
    line-height:1;
    display:flex;align-items:center;justify-content:center;
  }

  footer{display:flex;justify-content:center;gap:.6rem;padding:.5rem 1.25rem 0;flex-wrap:wrap;}
  footer button,footer label{
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.18);
    color:var(--shell-dim);
    padding:.55rem 1rem;
    border-radius:999px;
    font-family:var(--font-body);
    font-size:.78rem;
    font-weight:700;
    cursor:pointer;
    margin:0;
  }

  #toast{
    position:fixed;bottom:1.4rem;left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#4ade80;color:#052e12;
    padding:.6rem 1.3rem;border-radius:999px;
    font-family:var(--font-body);font-weight:700;font-size:.85rem;
    opacity:0;transition:opacity .25s ease, transform .25s ease;
    pointer-events:none;
    z-index:50;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  [data-theme="monday"]{--accent:#5eead4;background:linear-gradient(160deg,#0a2c2a 0%,#0f4c46 55%,#0d6d63 100%);}
  [data-theme="tuesday"]{--accent:#a5b4fc;background:linear-gradient(160deg,#0f1044 0%,#2d1b69 50%,#4338ca 100%);}
  [data-theme="wednesday"]{--accent:#fbbf24;background:linear-gradient(160deg,#3d0a0a 0%,#6d1414 50%,#8a2a1f 100%);}
  [data-theme="thursday"]{--accent:#a3e635;background:linear-gradient(160deg,#1a1033 0%,#3f1f6b 50%,#14532d 100%);}
  [data-theme="friday"]{--accent:#7dd3fc;background:linear-gradient(160deg,#062a3f 0%,#0c5478 40%,#7a1e6b 100%);}
  [data-theme="saturday"]{--accent:#fdba74;background:linear-gradient(160deg,#4a1607 0%,#8a2e0d 50%,#c2540f 100%);}
  [data-theme="progress"]{--accent:#f0abfc;background:linear-gradient(160deg,#1e1b2e 0%,#3b1e54 50%,#831843 100%);}

  .day-tab[data-theme="monday"]{--tab-c:#5eead4;}
  .day-tab[data-theme="tuesday"]{--tab-c:#a5b4fc;}
  .day-tab[data-theme="wednesday"]{--tab-c:#fbbf24;}
  .day-tab[data-theme="thursday"]{--tab-c:#a3e635;}
  .day-tab[data-theme="friday"]{--tab-c:#7dd3fc;}
  .day-tab[data-theme="saturday"]{--tab-c:#fdba74;}
  .day-tab[data-theme="progress"]{--tab-c:#f0abfc;}

  @media (max-width:400px){
    header h1{font-size:1.25rem;}
    .day-panel{padding:1.3rem 1rem 1.6rem;}
    .panel-icon{width:130px;height:130px;}
  }
</style>
</head>

      days:{monday:"Понедельник",tuesday:"Вторник",wednesday:"Среда",thursday:"Четверг",friday:"Пятница",saturday:"Суббота"},
      subjects:{biochemistry:"Биохимия",histology:"Гистология",psychology:"Психология",humanAnatomy:"Анатомия человека",microbiology:"Микробиология",hygiene:"Гигиена",normalPhysiology:"Нормальная физиология"},
      locations:{chorguzar:"Чоргузар",mainBuilding:"Главный корпус",asmiClinic:"Клиника ASMI, 6 этаж",studentDormitory:"Студенческое общежитие"},
      periods:"пары",
      learnedLabel:"Что я узнал(а) сегодня",
      homeworkLabel:"Домашнее задание",
      learnedPlaceholder:"Что вы узнали на этом занятии?",
      homeworkPlaceholder:"Задали ли домашнее задание или материал для чтения?",
      dateLabel:"Дата",
      scoreLabel:"Балл",
      scorePlaceholder:"например, 88/100",
      save:"Сохранить запись",
      noEntries:"Пока нет записей — добавьте первую выше.",
      entriesHistory:"История записей",
      export:"Скачать резервную копию",
      import:"Восстановить из копии",
      sundayTitle:"Сегодня занятий нет",
      sundayMessage:"Наслаждайтесь выходным! Выберите любой день выше, чтобы просмотреть записи или сделать домашнее задание заранее.",
      savedToast:"Сохранено!",
      importedToast:"Резервная копия восстановлена!",
      importError:"Не удалось прочитать этот файл как резервную копию.",
      progressNav:"\ud83d\udcca Мои результаты",
      progressTitle:"Мои результаты",
      periodWeek:"Эта неделя",
      periodMonth:"Этот месяц",
      periodAll:"За всё время",
      avgScoreLabel:"Средний балл",
      attendanceLabel:"Посещаемость",
      classesLabel:"Пройдено занятий",
      homeworkDoneLabel:"Выполнено домашних заданий",
      progressEmpty:"Пока нет записей за этот период. Добавьте запись в любой день, чтобы начать отслеживание.",
      scoredEntriesNote:"На основе {n} оценённых записей",
      attendedChip:"Был(а)",
      notAttendedChip:"Отсутствовал(а)",
      homeworkDoneChip:"Выполнено",
      homeworkNotDoneChip:"Ещё не выполнено"
    }
  };

  var lang = localStorage.getItem("scheduleLang") || "uz";
  var todayKey = (function(){
    var map = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
    return map[new Date().getDay()];
  })();
  var activeDay = DAY_ORDER.indexOf(todayKey) !== -1 ? todayKey : "monday";
  var activeView = "schedule";
  var progressPeriod = "week";
  var draftAttended = true;
  var draftHomeworkDone = false;

  function t(key){
    var parts = key.split(".");
    var obj = I18N[lang];
    for(var i=0;i<parts.length;i++){
      if(obj == null) break;
      obj = obj[parts[i]];
    }
    return obj != null ? obj : key;
  }

  function escapeHtml(str){
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function formatDate(iso){
    var bits = iso.split("-");
    var y = parseInt(bits[0],10), m = parseInt(bits[1],10), d = parseInt(bits[2],10);
    return d + " " + MONTHS[lang][m-1] + " " + y;
  }

  function todayISO(){
    var d = new Date();
    var m = ("0"+(d.getMonth()+1)).slice(-2);
    var day = ("0"+d.getDate()).slice(-2);
    return d.getFullYear()+"-"+m+"-"+day;
  }

  function toISO(d){
    var m = ("0"+(d.getMonth()+1)).slice(-2);
    var day = ("0"+d.getDate()).slice(-2);
    return d.getFullYear()+"-"+m+"-"+day;
  }

  function countNonSundayDays(startISOStr, endISOStr){
    var cursor = new Date(startISOStr+"T00:00:00");
    var end = new Date(endISOStr+"T00:00:00");
    var count = 0;
    while(cursor.getTime() <= end.getTime()){
      if(cursor.getDay() !== 0) count++;
      cursor.setDate(cursor.getDate()+1);
    }
    return count;
  }

  function parseScoreToPercent(scoreStr){
    if(!scoreStr) return null;
    var s = (""+scoreStr).trim();
    var frac = s.match(/^(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)$/);
    if(frac){
      var num = parseFloat(frac[1]), den = parseFloat(frac[2]);
      if(den > 0) return Math.max(0, Math.min(100, (num/den)*100));
    }
    var pct = s.match(/^(\d+(?:\.\d+)?)\s*%$/);
    if(pct) return Math.max(0, Math.min(100, parseFloat(pct[1])));
    var bare = s.match(/^(\d+(?:\.\d+)?)$/);
    if(bare){
      var v = parseFloat(bare[1]);
      if(v >= 0 && v <= 100) return v;
    }
    return null;
  }

  function getAllEntriesFlat(){
    var entries = getEntries();
    var flat = [];
    for(var i=0;i<DAY_ORDER.length;i++){
      var day = DAY_ORDER[i];
      var list = entries[day]||[];
      for(var j=0;j<list.length;j++){
        var e = list[j];
        flat.push({ day:day, id:e.id, date:e.date, homework:e.homework, score:e.score, attended:e.attended, homeworkDone:e.homeworkDone });
      }
    }
    return flat;
  }

  function computeStats(period){
    var all = getAllEntriesFlat();
    if(all.length === 0) return null;

    var todayD = new Date();
    var todayISOStr = toISO(todayD);
    var startISOStr;
    if(period === "week"){
      var dow = todayD.getDay();
      var diffToMonday = (dow === 0) ? 6 : dow - 1;
      var monday = new Date(todayD.getFullYear(), todayD.getMonth(), todayD.getDate()-diffToMonday);
      startISOStr = toISO(monday);
    } else if(period === "month"){
      startISOStr = toISO(new Date(todayD.getFullYear(), todayD.getMonth(), 1));
    } else {
      var minDate = all[0].date;
      for(var i=1;i<all.length;i++){ if(all[i].date < minDate) minDate = all[i].date; }
      startISOStr = minDate;
    }

    var filtered = [];
    for(var k=0;k<all.length;k++){
      if(all[k].date >= startISOStr && all[k].date <= todayISOStr) filtered.push(all[k]);
    }
    if(filtered.length === 0) return { empty:true };

    var attendedCount = 0, hwTotal = 0, hwDone = 0;
    var scores = [];
    for(var x=0;x<filtered.length;x++){
      var e = filtered[x];
      if(e.attended !== false) attendedCount++;
      var p = parseScoreToPercent(e.score);
      if(p !== null) scores.push(p);
      if(e.homework && (""+e.homework).trim()){
        hwTotal++;
        if(e.homeworkDone) hwDone++;
      }
    }
    var avgScore = null;
    if(scores.length){
      var sum = 0;
      for(var y=0;y<scores.length;y++) sum += scores[y];
      avgScore = Math.round(sum/scores.length);
    }
    var expected = Math.max(countNonSundayDays(startISOStr, todayISOStr), attendedCount);

    return {
      empty:false,
      total: filtered.length,
      expected: expected,
      attendedCount: attendedCount,
      attendedPct: Math.round(attendedCount/filtered.length*100),
      avgScore: avgScore,
      scoredCount: scores.length,
      hwTotal: hwTotal,
      hwDone: hwDone
    };
  }

  function withDraftPreserved(renderFn){
    var ids = ["entryDate","entryLearned","entryHomework","entryScore"];
    var vals = {};
    for(var i=0;i<ids.length;i++){
      var el = document.getElementById(ids[i]);
      vals[ids[i]] = el ? el.value : null;
    }
    renderFn();
    for(var j=0;j<ids.length;j++){
      var el2 = document.getElementById(ids[j]);
      if(el2 && vals[ids[j]] !== null) el2.value = vals[ids[j]];
    }
  }

  function getEntries(){
    try{
      return JSON.parse(localStorage.getItem("scheduleEntries")) || {};
    }catch(e){ return {}; }
  }
  function setEntries(data){
    localStorage.setItem("scheduleEntries", JSON.stringify(data));
  }

  function showToast(msg){
    var toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ toast.classList.remove("show"); }, 1900);
  }

  window.saveEntry = function(day){
    var dateEl = document.getElementById("entryDate");
    var learnedEl = document.getElementById("entryLearned");
    var homeworkEl = document.getElementById("entryHomework");
    var scoreEl = document.getElementById("entryScore");
    var learned = learnedEl.value.trim();
    var homework = homeworkEl.value.trim();
    var score = scoreEl.value.trim();
    if(!learned && !homework && !score) return;
    var entries = getEntries();
    entries[day] = entries[day] || [];
    entries[day].unshift({
      id: Date.now(),
      date: dateEl.value || todayISO(),
      learned: learned,
      homework: homework,
      score: score,
      attended: draftAttended,
      homeworkDone: draftHomeworkDone
    });
    setEntries(entries);
    draftAttended = true;
    draftHomeworkDone = false;
    renderPanel();
    showToast(t("savedToast"));
  };

  window.toggleDraftAttended = function(){
    draftAttended = !draftAttended;
    withDraftPreserved(renderPanel);
  };
  window.toggleDraftHomeworkDone = function(){
    draftHomeworkDone = !draftHomeworkDone;
    withDraftPreserved(renderPanel);
  };
  window.toggleAttended = function(day, id){
    var entries = getEntries();
    var list = entries[day]||[];
    for(var i=0;i<list.length;i++){
      if(list[i].id === id){ list[i].attended = (list[i].attended === false); break; }
    }
    setEntries(entries);
    renderPanel();
  };
  window.toggleHomeworkDone = function(day, id){
    var entries = getEntries();
    var list = entries[day]||[];
    for(var i=0;i<list.length;i++){
      if(list[i].id === id){ list[i].homeworkDone = !list[i].homeworkDone; break; }
    }
    setEntries(entries);
    renderPanel();
  };

  window.deleteEntry = function(day, id){
    var entries = getEntries();
    entries[day] = (entries[day]||[]).filter(function(e){ return e.id !== id; });
    setEntries(entries);
    renderPanel();
  };

  function renderStatic(){
    document.documentElement.lang = lang;
    document.title = t("appTitle");
    var nodes = document.querySelectorAll("[data-i18n]");
    for(var i=0;i<nodes.length;i++){
      nodes[i].textContent = t(nodes[i].getAttribute("data-i18n"));
    }
  }

  function renderLangButtons(){
    var btns = document.querySelectorAll(".lang-switch button");
    for(var i=0;i<btns.length;i++){
      btns[i].classList.toggle("active", btns[i].getAttribute("data-lang") === lang);
    }
  }

  function renderRestBanner(){
    var el = document.getElementById("restBanner");
    if(todayKey === "sunday"){
      el.style.display = "block";
      el.innerHTML = "<strong>"+escapeHtml(t("sundayTitle"))+"</strong><p>"+escapeHtml(t("sundayMessage"))+"</p>";
    } else {
      el.style.display = "none";
      el.innerHTML = "";
    }
  }

  function renderTabs(){
    var nav = document.getElementById("dayTabs");
    nav.innerHTML = "";
    for(var i=0;i<DAY_ORDER.length;i++){
      (function(day){
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "day-tab" + (day===activeDay && activeView==="schedule" ? " active" : "") + (day===todayKey ? " is-today" : "");
        btn.setAttribute("data-theme", day);
        btn.textContent = t("days."+day);
        btn.onclick = function(){
          activeDay = day;
          activeView = "schedule";
          draftAttended = true;
          draftHomeworkDone = false;
          renderAll();
        };
        nav.appendChild(btn);
      })(DAY_ORDER[i]);
    }
    var progBtn = document.createElement("button");
    progBtn.type = "button";
    progBtn.className = "day-tab progress-tab" + (activeView==="progress" ? " active" : "");
    progBtn.setAttribute("data-theme", "progress");
    progBtn.textContent = t("progressNav");
    progBtn.onclick = function(){ activeView = "progress"; renderAll(); };
    nav.appendChild(progBtn);
  }

  function renderPanel(){
    var panel = document.getElementById("dayPanel");
    panel.setAttribute("data-theme", activeDay);
    var info = SCHEDULE[activeDay];

    var subjectsHtml = info.subjects.map(function(s){
      return '<div class="subject-card">'
        + "<h3>"+escapeHtml(t("subjects."+s.key))+"</h3>"
        + '<p class="t1">'+s.start+" – "+s.end+"</p>"
        + '<p class="t2">'+s.periods+" "+escapeHtml(t("periods"))+"</p>"
        + "</div>";
    }).join("");

    var entries = (getEntries()[activeDay]||[]).slice().sort(function(a,b){
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return b.id - a.id;
    });

    var entriesHtml;
    if(entries.length === 0){
      entriesHtml = '<p class="no-entries">'+escapeHtml(t("noEntries"))+"</p>";
    } else {
      entriesHtml = entries.map(function(e){
        var fields = "";
        if(e.learned){
          fields += '<div class="entry-field"><b>'+EMOJI.learned+" "+escapeHtml(t("learnedLabel"))+":</b> <span>"+escapeHtml(e.learned)+"</span></div>";
        }
        if(e.homework){
          fields += '<div class="entry-field"><b>'+EMOJI.homework+" "+escapeHtml(t("homeworkLabel"))+":</b> <span>"+escapeHtml(e.homework)+"</span></div>";
        }
        var scoreBadge = e.score ? '<span class="score-badge">'+EMOJI.score+" "+escapeHtml(e.score)+"</span>" : "";
        var attendedOn = e.attended !== false;
        var hwOn = !!e.homeworkDone;
        var hasHwText = e.homework && (""+e.homework).trim();
        var statusHtml = '<div class="entry-status">'
          + '<button type="button" class="chip-toggle small'+(attendedOn?" on":"")+'" onclick="toggleAttended(\''+activeDay+"', "+e.id+')">'+(attendedOn?"\u2705 ":"\u2b1c ")+escapeHtml(attendedOn?t("attendedChip"):t("notAttendedChip"))+"</button>";
        if(hasHwText){
          statusHtml += '<button type="button" class="chip-toggle small'+(hwOn?" on":"")+'" onclick="toggleHomeworkDone(\''+activeDay+"', "+e.id+')">'+(hwOn?"\u2611\ufe0f ":"\u2b1c ")+escapeHtml(hwOn?t("homeworkDoneChip"):t("homeworkNotDoneChip"))+"</button>";
        }
        statusHtml += "</div>";
        return '<div class="entry-card">'
          + '<button class="delete-btn" onclick="deleteEntry(\''+activeDay+"', "+e.id+')">\u00d7</button>'
          + '<div class="entry-top"><span class="entry-date">'+formatDate(e.date)+"</span>"+scoreBadge+"</div>"
          + fields
          + statusHtml
          + "</div>";
      }).join("");
    }

    panel.innerHTML =
      '<div class="panel-icon">'+ICONS[activeDay]+"</div>"
      + '<div class="panel-header"><h2>'+escapeHtml(t("days."+activeDay))+'</h2><p class="loc">\ud83d\udccd '+escapeHtml(t("locations."+info.location))+"</p></div>"
      + '<div class="subjects">'+subjectsHtml+"</div>"
      + '<div class="entry-form">'
        + "<label>"+escapeHtml(t("dateLabel"))+'</label><input type="date" id="entryDate" value="'+todayISO()+'">'
        + "<label>"+EMOJI.learned+" "+escapeHtml(t("learnedLabel"))+'</label><textarea id="entryLearned" placeholder="'+escapeHtml(t("learnedPlaceholder"))+'"></textarea>'
        + "<label>"+EMOJI.homework+" "+escapeHtml(t("homeworkLabel"))+'</label><textarea id="entryHomework" placeholder="'+escapeHtml(t("homeworkPlaceholder"))+'"></textarea>'
        + "<label>"+EMOJI.score+" "+escapeHtml(t("scoreLabel"))+'</label><input type="text" id="entryScore" placeholder="'+escapeHtml(t("scorePlaceholder"))+'">'
        + '<div class="chip-row">'
          + '<button type="button" class="chip-toggle'+(draftAttended?" on":"")+'" onclick="toggleDraftAttended()">'+(draftAttended?"\u2705 ":"\u2b1c ")+escapeHtml(draftAttended?t("attendedChip"):t("notAttendedChip"))+"</button>"
          + '<button type="button" class="chip-toggle'+(draftHomeworkDone?" on":"")+'" onclick="toggleDraftHomeworkDone()">'+(draftHomeworkDone?"\u2611\ufe0f ":"\u2b1c ")+escapeHtml(draftHomeworkDone?t("homeworkDoneChip"):t("homeworkNotDoneChip"))+"</button>"
        + "</div>"
        + '<button class="btn-save" type="button" onclick="saveEntry(\''+activeDay+'\')">'+escapeHtml(t("save"))+"</button>"
      + "</div>"
      + '<h3 class="history-title">'+escapeHtml(t("entriesHistory"))+"</h3>"
      + '<div class="entries-list">'+entriesHtml+"</div>";
  }

  function statCard(emoji, label, value, sub){
    return '<div class="stat-card"><div class="stat-emoji">'+emoji+'</div><div class="stat-label">'+escapeHtml(label)+'</div><div class="stat-value">'+escapeHtml(value)+"</div>"
      + (sub ? '<div class="stat-sub">'+escapeHtml(sub)+"</div>" : "")
      + "</div>";
  }

  window.setProgressPeriod = function(p){
    progressPeriod = p;
    renderProgressPanel();
  };

  function renderProgressPanel(){
    var panel = document.getElementById("dayPanel");
    panel.setAttribute("data-theme", "progress");

    var periods = ["week","month","all"];
    var periodKeys = {week:"periodWeek", month:"periodMonth", all:"periodAll"};
    var periodBtns = "";
    for(var i=0;i<periods.length;i++){
      var p = periods[i];
      periodBtns += '<button type="button" class="period-btn'+(progressPeriod===p?" active":"")+'" onclick="setProgressPeriod(\''+p+'\')">'+escapeHtml(t(periodKeys[p]))+"</button>";
    }

    var stats = computeStats(progressPeriod);
    var body;
    if(!stats || stats.empty){
      body = '<p class="no-entries" style="position:relative;margin-top:.5rem;">'+escapeHtml(t("progressEmpty"))+"</p>";
    } else {
      var avgDisplay = stats.avgScore !== null ? stats.avgScore+"%" : "\u2014";
      var avgSub = stats.scoredCount ? t("scoredEntriesNote").replace("{n}", stats.scoredCount) : "";
      var attDisplay = stats.attendedPct+"%";
      var attSub = stats.attendedCount+"/"+stats.total;
      var classesDisplay = stats.attendedCount+"/"+stats.expected;
      var hwDisplay = stats.hwTotal ? (stats.hwDone+"/"+stats.hwTotal) : "\u2014";

      body = '<div class="stats-grid">'
        + statCard("\ud83c\udfaf", t("avgScoreLabel"), avgDisplay, avgSub)
        + statCard("\u2705", t("attendanceLabel"), attDisplay, attSub)
        + statCard("\ud83d\udcc5", t("classesLabel"), classesDisplay, "")
        + statCard("\ud83d\udcdd", t("homeworkDoneLabel"), hwDisplay, "")
        + "</div>";
    }

    panel.innerHTML =
      '<div class="panel-icon">'+PROGRESS_ICON+"</div>"
      + '<div class="panel-header"><h2>'+escapeHtml(t("progressTitle"))+"</h2></div>"
      + '<div class="period-toggle">'+periodBtns+"</div>"
      + body;
  }

  function renderAll(){
    renderStatic();
    renderLangButtons();
    renderRestBanner();
    renderTabs();
    if(activeView === "progress"){ renderProgressPanel(); } else { renderPanel(); }
  }

  function switchLang(newLang){
    lang = newLang;
    localStorage.setItem("scheduleLang", lang);
    withDraftPreserved(renderAll);
  }

  var langBtns = document.querySelectorAll(".lang-switch button");
  for(var i=0;i<langBtns.length;i++){
    langBtns[i].addEventListener("click", function(){
      switchLang(this.getAttribute("data-lang"));
    });
  }

  document.getElementById("exportBtn").addEventListener("click", function(){
    var data = { entries: getEntries(), lang: lang, exportedAt: todayISO() };
    var blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "dars-jadvali-backup.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById("importInput").addEventListener("change", function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        if(data.entries) setEntries(data.entries);
        if(data.lang && I18N[data.lang]) {
          lang = data.lang;
          localStorage.setItem("scheduleLang", lang);
        }
        renderAll();
        showToast(t("importedToast"));
      }catch(err){
        alert(t("importError"));
      }
      e.target.value = "";
    };
    reader.readAsText(file);
  });

  renderAll();
})();
</script>
