<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Weekly class schedule, notes and homework tracker">
<meta name="theme-color" content="#0c0e13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<title>TFIG 248 — Dars Jadvali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --shell-bg:#0b0b0d;
    --shell-text:#f1ede8;
    --shell-dim:#8f8b87;
    --accent:#c9885a;
    --accent-light:#e0a56f;
    --font-head:'Plus Jakarta Sans', sans-serif;
    --font-body:'Inter', sans-serif;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  button{
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    user-select:none;
    touch-action:manipulation;
    appearance:none;
    -webkit-appearance:none;
  }
  button:active{opacity:.8;}
  body{
    background:var(--shell-bg);
    color:var(--shell-text);
    font-family:var(--font-body);
    min-height:100vh;
    min-height:100dvh;
    -webkit-text-size-adjust:100%;
  }
  .app{max-width:640px;margin:0 auto;padding-bottom:calc(2rem + env(safe-area-inset-bottom));}

  header{padding:1.75rem 1.25rem .5rem;text-align:center;}
  .lang-switch{display:flex;justify-content:center;gap:.4rem;margin-bottom:1rem;}
  .lang-switch button{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.16);
    color:var(--shell-dim);
    padding:.5rem .9rem;
    border-radius:999px;
    font-family:var(--font-body);
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.04em;
    cursor:pointer;
  }
  .lang-switch button.active{background:var(--shell-text);color:var(--shell-bg);border-color:var(--shell-text);}
  .brand-mark{width:34px;height:34px;margin:0 auto .3rem;color:var(--accent);}
  .brand-mark svg{width:100%;height:100%;}
  header h1{
    font-family:var(--font-head);
    font-weight:800;
    font-size:1.45rem;
    line-height:1.25;
    margin:.2rem 0 .4rem;
  }
  header .subtitle{color:var(--shell-dim);font-size:.92rem;margin:0;line-height:1.4;}

  #restBanner{
    display:none;
    margin:1rem 1.25rem 0;
    padding:1rem 1.25rem;
    background:linear-gradient(135deg,#1c2333,#2a3348);
    border-radius:16px;
    text-align:center;
  }
  #restBanner strong{display:block;font-family:var(--font-head);font-size:1.05rem;margin-bottom:.3rem;}
  #restBanner p{margin:0;color:var(--shell-dim);font-size:.87rem;line-height:1.4;}

  .day-tabs{
    display:flex;
    gap:.3rem;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding:1.1rem 1.25rem 0;
    scrollbar-width:none;
  }
  .day-tabs::-webkit-scrollbar{display:none;}
  .day-tab{
    flex:0 0 auto;
    padding:.6rem 1.1rem;
    border-radius:10px 10px 0 0;
    border:1px solid rgba(255,255,255,.09);
    background:linear-gradient(160deg,#1f1f22,#161618);
    color:var(--shell-dim);
    font-family:var(--font-head);
    font-weight:700;
    font-size:.82rem;
    cursor:pointer;
    white-space:nowrap;
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:.35rem;
  }
  .day-tab .icon-inline{width:13px;height:13px;color:var(--accent);}
  .day-tab.active{color:#f0d9c2;}
  .day-tab.active::before{
    content:'';
    position:absolute;top:-1px;left:10%;right:10%;height:2px;
    background:linear-gradient(90deg,var(--accent-light),var(--accent));
    border-radius:2px 2px 0 0;
  }
  .day-tab.is-today:not(.active)::after{
    content:'';
    position:absolute;top:-4px;right:-3px;
    width:7px;height:7px;border-radius:50%;
    background:#4ade80;
    box-shadow:0 0 0 2px var(--shell-bg);
  }

  .day-panel{
    position:relative;
    margin:0 1.25rem 1.5rem;
    padding:1.6rem 1.25rem 1.9rem;
    border-radius:0 var(--radius) var(--radius) var(--radius);
    overflow:hidden;
    color:#fff;
  }
  .panel-icon{
    position:absolute;
    top:-18px;right:-22px;
    width:170px;height:170px;
    color:var(--accent,#fff);
    opacity:.14;
    pointer-events:none;
  }
  .icon-inline{display:inline-flex;vertical-align:-3px;flex:0 0 auto;}
  .icon-inline svg{width:100%;height:100%;display:block;}
  .panel-header{position:relative;margin-bottom:1.1rem;}
  .panel-header h2{font-family:var(--font-head);font-size:1.5rem;margin:0 0 .3rem;}
  .panel-header .loc{font-size:.85rem;color:rgba(255,255,255,.78);margin:0;display:flex;align-items:center;gap:.3rem;}
  .panel-header .loc .icon-inline{width:14px;height:14px;color:var(--accent);}

  .subjects{position:relative;display:flex;flex-wrap:wrap;gap:.7rem;margin-bottom:1.3rem;}
  .subject-card{
    flex:1 1 170px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    border-radius:14px;
    padding:.8rem 1rem;
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    position:relative;
    overflow:hidden;
  }
  .subject-card::before{
    content:'';
    position:absolute;top:0;right:0;
    width:34px;height:34px;
    background:var(--sc,var(--accent));
    opacity:.4;
    border-radius:0 14px 0 100%;
  }
  .subject-card h3{margin:0 0 .35rem;font-family:var(--font-head);font-size:1.05rem;position:relative;}
  .subject-card .t1{margin:0;font-size:.87rem;color:rgba(255,255,255,.92);position:relative;display:flex;align-items:center;gap:.3rem;}
  .subject-card .t1 .icon-inline{width:12px;height:12px;color:var(--accent);flex-shrink:0;}
  .subject-card .t2{margin:.15rem 0 0;font-size:.78rem;color:rgba(255,255,255,.68);position:relative;}

  .entry-form{
    position:relative;
    background:rgba(0,0,0,.24);
    border-radius:16px;
    padding:1rem 1rem 1.1rem;
    margin-bottom:1.3rem;
  }
  .entry-form label{
    display:flex;
    align-items:center;
    gap:.35rem;
    font-size:.78rem;
    font-weight:700;
    color:rgba(255,255,255,.82);
    margin:.55rem 0 .3rem;
  }
  .entry-form label:first-child{margin-top:0;}
  .entry-form label .icon-inline{width:14px;height:14px;color:var(--accent);}
  .entry-form input[type="date"],
  .entry-form input[type="text"],
  .entry-form textarea{
    width:100%;
    background:rgba(0,0,0,.22);
    border:1.5px solid rgba(201,136,90,.55);
    border-radius:10px;
    color:#fff;
    padding:.6rem .7rem;
    font-family:var(--font-body);
    font-size:16px;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.35);
  }
  .entry-form input[type="date"]:focus,
  .entry-form input[type="text"]:focus,
  .entry-form textarea:focus{
    outline:none;
    border-color:var(--accent);
  }
  .entry-form textarea{min-height:72px;resize:vertical;line-height:1.4;}
  .entry-form input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1);cursor:pointer;}
  .toggle-row{position:relative;display:inline-flex;align-items:center;gap:.55rem;margin:.7rem 1rem .1rem 0;}
  .toggle-switch{
    width:42px;height:24px;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.22);
    border-radius:999px;
    position:relative;
    cursor:pointer;
    flex:0 0 auto;
    padding:0;
    transition:background .18s ease,border-color .18s ease;
  }
  .toggle-switch .knob{
    position:absolute;top:2px;left:2px;
    width:18px;height:18px;
    background:#fff;
    border-radius:50%;
    transition:transform .18s ease;
    box-shadow:0 1px 3px rgba(0,0,0,.35);
    display:block;
  }
  .toggle-switch.on{background:var(--accent);border-color:var(--accent);}
  .toggle-switch.on .knob{transform:translateX(18px);}
  .toggle-switch.small{width:34px;height:20px;}
  .toggle-switch.small .knob{width:14px;height:14px;}
  .toggle-switch.small.on .knob{transform:translateX(14px);}
  .toggle-label{font-size:.82rem;color:rgba(255,255,255,.85);font-weight:600;}
  .entry-status{position:relative;display:flex;gap:.3rem;margin-top:.6rem;flex-wrap:wrap;}
  .btn-save{
    margin-top:.9rem;
    background:linear-gradient(135deg,var(--accent-light),var(--accent));
    color:#1c1208;
    border:none;
    font-family:var(--font-body);
    font-weight:700;
    padding:.6rem 1.5rem;
    border-radius:999px;
    cursor:pointer;
    font-size:.88rem;
  }

  .period-toggle{position:relative;display:flex;gap:.4rem;margin-bottom:1.2rem;flex-wrap:wrap;}
  .period-btn{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.24);
    color:rgba(255,255,255,.82);
    padding:.42rem .9rem;
    border-radius:999px;
    font-family:var(--font-body);
    font-size:.8rem;
    font-weight:700;
    cursor:pointer;
  }
  .period-btn.active{background:var(--accent,#fff);color:#1c1208;border-color:var(--accent,#fff);}
  .stats-grid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:.8rem;}
  .stat-card{
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.2);
    border-radius:16px;
    padding:1rem .9rem;
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
  }
  .stat-emoji{margin-bottom:.4rem;}
  .stat-emoji .icon-inline{width:24px;height:24px;color:var(--accent);}
  .stat-label{font-size:.76rem;color:rgba(255,255,255,.8);margin-bottom:.2rem;}
  .stat-value{font-family:var(--font-head);font-size:1.6rem;font-weight:700;color:var(--accent,#fff);}
  .stat-sub{font-size:.7rem;color:rgba(255,255,255,.6);margin-top:.25rem;}
  @media (max-width:340px){
    .stats-grid{grid-template-columns:1fr;}
  }

  .history-title{position:relative;font-family:var(--font-head);font-size:1.05rem;margin:0 0 .7rem;color:rgba(255,255,255,.92);}
  .entries-list{position:relative;display:flex;flex-direction:column;gap:.6rem;}
  .entry-card{
    position:relative;
    background:rgba(0,0,0,.24);
    border-radius:12px;
    padding:.8rem 2.5rem .8rem 1rem;
    font-size:.86rem;
    line-height:1.45;
  }
  .entry-top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.4rem;}
  .entry-date{font-weight:700;color:var(--accent,#fff);font-family:var(--font-head);}
  .score-badge{display:inline-flex;align-items:center;gap:.25rem;background:var(--accent,#fff);color:#1c1208;font-weight:700;font-size:.76rem;padding:.18rem .6rem;border-radius:999px;white-space:nowrap;font-family:var(--font-body);}
  .score-badge .icon-inline{width:12px;height:12px;}
  .entry-field{margin-bottom:.2rem;}
  .entry-field b{color:rgba(255,255,255,.88);font-weight:700;display:inline-flex;align-items:center;gap:.3rem;}
  .entry-field .icon-inline{width:13px;height:13px;color:var(--accent);}
  .entry-field span{color:rgba(255,255,255,.92);}
  .no-entries{position:relative;color:rgba(255,255,255,.62);font-style:italic;font-size:.86rem;margin:0;}
  .delete-btn{
    position:absolute;top:.5rem;right:.5rem;
    width:32px;height:32px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.12);
    color:rgba(255,255,255,.8);
    cursor:pointer;
    line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  .delete-btn .icon-inline{width:14px;height:14px;}

  footer{display:flex;justify-content:center;gap:.6rem;padding:.5rem 1.25rem 0;flex-wrap:wrap;}
  footer button,footer label{
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.18);
    color:var(--shell-dim);
    padding:.55rem 1rem;
    border-radius:999px;
    font-family:var(--font-body);
    font-size:.78rem;
    font-weight:700;
    cursor:pointer;
    margin:0;
  }

  #toast{
    position:fixed;bottom:1.4rem;left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#4ade80;color:#052e12;
    padding:.6rem 1.3rem;border-radius:999px;
    font-family:var(--font-body);font-weight:700;font-size:.85rem;
    opacity:0;transition:opacity .25s ease, transform .25s ease;
    pointer-events:none;
    z-index:50;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .day-panel{
    background:linear-gradient(160deg,#1c1c1f 0%,#242428 55%,#121214 100%);
    -webkit-backdrop-filter:blur(14px);
    backdrop-filter:blur(14px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 20px 40px -20px rgba(0,0,0,.6);
  }

  .subject-card[data-subj="biochemistry"]{--sc:#7fae9c;}
  .subject-card[data-subj="histology"]{--sc:#8b7fd6;}
  .subject-card[data-subj="psychology"]{--sc:#8b93d6;}
  .subject-card[data-subj="humanAnatomy"]{--sc:#c17d84;}
  .subject-card[data-subj="microbiology"]{--sc:#8fae7f;}
  .subject-card[data-subj="hygiene"]{--sc:#5fada3;}
  .subject-card[data-subj="normalPhysiology"]{--sc:#c9885a;}
  .subject-card[data-subj="marifat"]{--sc:#b8a066;}

  @media (max-width:400px){
    header h1{font-size:1.25rem;}
    .day-panel{padding:1.3rem 1rem 1.6rem;}
    .panel-icon{width:130px;height:130px;}
  }
</style>
</head>

  var lang = localStorage.getItem("scheduleLang") || "uz";
  var todayKey = (function(){
    var map = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
    return map[new Date().getDay()];
  })();
  var activeDay = DAY_ORDER.indexOf(todayKey) !== -1 ? todayKey : "monday";
  var activeView = "schedule";
  var progressPeriod = "week";
  var draftAttended = true;
  var draftHomeworkDone = false;

  function t(key){
    var parts = key.split(".");
    var obj = I18N[lang];
    for(var i=0;i<parts.length;i++){
      if(obj == null) break;
      obj = obj[parts[i]];
    }
    return obj != null ? obj : key;
  }

  function escapeHtml(str){
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function formatDate(iso){
    var bits = iso.split("-");
    var y = parseInt(bits[0],10), m = parseInt(bits[1],10), d = parseInt(bits[2],10);
    return d + " " + MONTHS[lang][m-1] + " " + y;
  }

  function formatPeriod(s){
    if(s.periods === 1){
      return t("periodSingleTemplate").replace("{a}", s.periodStart);
    }
    var endP = s.periodStart + s.periods - 1;
    return t("periodsRangeTemplate").replace("{a}", s.periodStart).replace("{b}", endP);
  }

  function todayISO(){
    var d = new Date();
    var m = ("0"+(d.getMonth()+1)).slice(-2);
    var day = ("0"+d.getDate()).slice(-2);
    return d.getFullYear()+"-"+m+"-"+day;
  }

  function toISO(d){
    var m = ("0"+(d.getMonth()+1)).slice(-2);
    var day = ("0"+d.getDate()).slice(-2);
    return d.getFullYear()+"-"+m+"-"+day;
  }

  function countNonSundayDays(startISOStr, endISOStr){
    var cursor = new Date(startISOStr+"T00:00:00");
    var end = new Date(endISOStr+"T00:00:00");
    var count = 0;
    while(cursor.getTime() <= end.getTime()){
      if(cursor.getDay() !== 0) count++;
      cursor.setDate(cursor.getDate()+1);
    }
    return count;
  }

  function parseScoreToPercent(scoreStr){
    if(!scoreStr) return null;
    var s = (""+scoreStr).trim();
    var frac = s.match(/^(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)$/);
    if(frac){
      var num = parseFloat(frac[1]), den = parseFloat(frac[2]);
      if(den > 0) return Math.max(0, Math.min(100, (num/den)*100));
    }
    var pct = s.match(/^(\d+(?:\.\d+)?)\s*%$/);
    if(pct) return Math.max(0, Math.min(100, parseFloat(pct[1])));
    var bare = s.match(/^(\d+(?:\.\d+)?)$/);
    if(bare){
      var v = parseFloat(bare[1]);
      if(v >= 0 && v <= 100) return v;
    }
    return null;
  }

  function getAllEntriesFlat(){
    var entries = getEntries();
    var flat = [];
    for(var i=0;i<DAY_ORDER.length;i++){
      var day = DAY_ORDER[i];
      var list = entries[day]||[];
      for(var j=0;j<list.length;j++){
        var e = list[j];
        flat.push({ day:day, id:e.id, date:e.date, homework:e.homework, score:e.score, attended:e.attended, homeworkDone:e.homeworkDone });
      }
    }
    return flat;
  }

  function computeStats(period){
    var all = getAllEntriesFlat();
    if(all.length === 0) return null;

    var todayD = new Date();
    var todayISOStr = toISO(todayD);
    var startISOStr;
    if(period === "week"){
      var dow = todayD.getDay();
      var diffToMonday = (dow === 0) ? 6 : dow - 1;
      var monday = new Date(todayD.getFullYear(), todayD.getMonth(), todayD.getDate()-diffToMonday);
      startISOStr = toISO(monday);
    } else if(period === "month"){
      startISOStr = toISO(new Date(todayD.getFullYear(), todayD.getMonth(), 1));
    } else {
      var minDate = all[0].date;
      for(var i=1;i<all.length;i++){ if(all[i].date < minDate) minDate = all[i].date; }
      startISOStr = minDate;
    }

    var filtered = [];
    for(var k=0;k<all.length;k++){
      if(all[k].date >= startISOStr && all[k].date <= todayISOStr) filtered.push(all[k]);
    }
    if(filtered.length === 0) return { empty:true };

    var attendedCount = 0, hwTotal = 0, hwDone = 0;
    var scores = [];
    for(var x=0;x<filtered.length;x++){
      var e = filtered[x];
      if(e.attended !== false) attendedCount++;
      var p = parseScoreToPercent(e.score);
      if(p !== null) scores.push(p);
      if(e.homework && (""+e.homework).trim()){
        hwTotal++;
        if(e.homeworkDone) hwDone++;
      }
    }
    var avgScore = null;
    if(scores.length){
      var sum = 0;
      for(var y=0;y<scores.length;y++) sum += scores[y];
      avgScore = Math.round(sum/scores.length);
    }
    var expected = Math.max(countNonSundayDays(startISOStr, todayISOStr), attendedCount);

    return {
      empty:false,
      total: filtered.length,
      expected: expected,
      attendedCount: attendedCount,
      attendedPct: Math.round(attendedCount/filtered.length*100),
      avgScore: avgScore,
      scoredCount: scores.length,
      hwTotal: hwTotal,
      hwDone: hwDone
    };
  }

  function withDraftPreserved(renderFn){
    var ids = ["entryDate","entryLearned","entryHomework","entryScore"];
    var vals = {};
    for(var i=0;i<ids.length;i++){
      var el = document.getElementById(ids[i]);
      vals[ids[i]] = el ? el.value : null;
    }
    renderFn();
    for(var j=0;j<ids.length;j++){
      var el2 = document.getElementById(ids[j]);
      if(el2 && vals[ids[j]] !== null) el2.value = vals[ids[j]];
    }
  }

  function getEntries(){
    try{
      return JSON.parse(localStorage.getItem("scheduleEntries")) || {};
    }catch(e){ return {}; }
  }
  function setEntries(data){
    localStorage.setItem("scheduleEntries", JSON.stringify(data));
  }

  function showToast(msg){
    var toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ toast.classList.remove("show"); }, 1900);
  }

  window.saveEntry = function(day){
    var dateEl = document.getElementById("entryDate");
    var learnedEl = document.getElementById("entryLearned");
    var homeworkEl = document.getElementById("entryHomework");
    var scoreEl = document.getElementById("entryScore");
    var learned = learnedEl.value.trim();
    var homework = homeworkEl.value.trim();
    var score = scoreEl.value.trim();
    if(!learned && !homework && !score) return;
    var entries = getEntries();
    entries[day] = entries[day] || [];
    entries[day].unshift({
      id: Date.now(),
      date: dateEl.value || todayISO(),
      learned: learned,
      homework: homework,
      score: score,
      attended: draftAttended,
      homeworkDone: draftHomeworkDone
    });
    setEntries(entries);
    draftAttended = true;
    draftHomeworkDone = false;
    renderPanel();
    showToast(t("savedToast"));
  };

  window.toggleDraftAttended = function(){
    draftAttended = !draftAttended;
    withDraftPreserved(renderPanel);
  };
  window.toggleDraftHomeworkDone = function(){
    draftHomeworkDone = !draftHomeworkDone;
    withDraftPreserved(renderPanel);
  };
  window.toggleAttended = function(day, id){
    var entries = getEntries();
    var list = entries[day]||[];
    for(var i=0;i<list.length;i++){
      if(list[i].id === id){ list[i].attended = (list[i].attended === false); break; }
    }
    setEntries(entries);
    renderPanel();
  };
  window.toggleHomeworkDone = function(day, id){
    var entries = getEntries();
    var list = entries[day]||[];
    for(var i=0;i<list.length;i++){
      if(list[i].id === id){ list[i].homeworkDone = !list[i].homeworkDone; break; }
    }
    setEntries(entries);
    renderPanel();
  };

  window.deleteEntry = function(day, id){
    var entries = getEntries();
    entries[day] = (entries[day]||[]).filter(function(e){ return e.id !== id; });
    setEntries(entries);
    renderPanel();
  };

  function renderStatic(){
    document.documentElement.lang = lang;
    document.title = t("appTitle");
    var nodes = document.querySelectorAll("[data-i18n]");
    for(var i=0;i<nodes.length;i++){
      nodes[i].textContent = t(nodes[i].getAttribute("data-i18n"));
    }

  function renderLangButtons(){
    var btns = document.querySelectorAll(".lang-switch button");
    for(var i=0;i<btns.length;i++){
      btns[i].classList.toggle("active", btns[i].getAttribute("data-lang") === lang);

  function renderRestBanner(){
    var el = document.getElementById("restBanner");
    if(todayKey === "sunday"){
      el.style.display = "block";
      el.innerHTML = "<strong>"+escapeHtml(t("sundayTitle"))+"</strong><p>"+escapeHtml(t("sundayMessage"))+"</p>";
    } else {
      el.style.display = "none";
      el.innerHTML = "";

  function renderTabs(){
    var nav = document.getElementById("dayTabs");
    nav.innerHTML = "";
    for(var i=0;i<DAY_ORDER.length;i++){
      (function(day){
        var btn = document.createElement("button");
        btn.type = "button";
        var isActive = (day===activeDay && activeView==="schedule");
        btn.className = "day-tab" + (isActive ? " active" : "") + (day===todayKey ? " is-today" : "");
        btn.innerHTML = (isActive ? ic("calendar") : "") + escapeHtml(t("days."+day));
        btn.onclick = function(){
          activeDay = day;
          activeView = "schedule";
          draftAttended = true;
          draftHomeworkDone = false;
          renderAll();
        };
        nav.appendChild(btn);
      })(DAY_ORDER[i]);
    }
    var progBtn = document.createElement("button");
    progBtn.type = "button";
    progBtn.className = "day-tab progress-tab" + (activeView==="progress" ? " active" : "");
    progBtn.innerHTML = ic("progress") + escapeHtml(t("progressNav"));
    progBtn.onclick = function(){ activeView = "progress"; renderAll(); };
    nav.appendChild(progBtn);
  }

  function renderPanel(){
    var panel = document.getElementById("dayPanel");
    panel.setAttribute("data-theme", activeDay);
    var info = SCHEDULE[activeDay];

    var subjectsHtml = info.subjects.map(function(s){
      return '<div class="subject-card" data-subj="'+s.key+'">'
        + "<h3>"+escapeHtml(t("subjects."+s.key))+"</h3>"
        + '<p class="t1">'+ic("location")+" "+escapeHtml(t("locations."+s.location))+"</p>"
        + '<p class="t2">'+escapeHtml(formatPeriod(s))+"</p>"
        + "</div>";
    }).join("");

    var entries = (getEntries()[activeDay]||[]).slice().sort(function(a,b){
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return b.id - a.id;
    });

    var entriesHtml;
    if(entries.length === 0){
      entriesHtml = '<p class="no-entries">'+escapeHtml(t("noEntries"))+"</p>";
    } else {
      entriesHtml = entries.map(function(e){
        var fields = "";
        if(e.learned){
          fields += '<div class="entry-field"><b>'+ic("learned")+" "+escapeHtml(t("learnedLabel"))+":</b> <span>"+escapeHtml(e.learned)+"</span></div>";
        }
        if(e.homework){
          fields += '<div class="entry-field"><b>'+ic("homework")+" "+escapeHtml(t("homeworkLabel"))+":</b> <span>"+escapeHtml(e.homework)+"</span></div>";
        }
        var scoreBadge = e.score ? '<span class="score-badge">'+ic("score")+" "+escapeHtml(e.score)+"</span>" : "";
        var attendedOn = e.attended !== false;
        var hwOn = !!e.homeworkDone;
        var hasHwText = e.homework && (""+e.homework).trim();
        var statusHtml = '<div class="entry-status">'
          + '<div class="toggle-row"><button type="button" class="toggle-switch small'+(attendedOn?" on":"")+'" onclick="toggleAttended(\''+activeDay+"', "+e.id+')"><span class="knob"></span></button><span class="toggle-label">'+escapeHtml(t("attendedChip"))+"</span></div>";
        if(hasHwText){
          statusHtml += '<div class="toggle-row"><button type="button" class="toggle-switch small'+(hwOn?" on":"")+'" onclick="toggleHomeworkDone(\''+activeDay+"', "+e.id+')"><span class="knob"></span></button><span class="toggle-label">'+escapeHtml(t("homeworkDoneChip"))+"</span></div>";
        }
        statusHtml += "</div>";
        return '<div class="entry-card">'
          + '<button class="delete-btn" onclick="deleteEntry(\''+activeDay+"', "+e.id+')">'+ic("close")+"</button>"
          + '<div class="entry-top"><span class="entry-date">'+formatDate(e.date)+"</span>"+scoreBadge+"</div>"
          + fields
          + statusHtml
          + "</div>";
      }).join("");
    }

    panel.innerHTML =
      '<div class="panel-icon">'+WATERMARK_ICON+"</div>"
      + '<div class="panel-header"><h2>'+escapeHtml(t("days."+activeDay))+"</h2></div>"
      + '<div class="subjects">'+subjectsHtml+"</div>"
      + '<div class="entry-form">'
        + "<label>"+escapeHtml(t("dateLabel"))+'</label><input type="date" id="entryDate" value="'+todayISO()+'">'
        + "<label>"+ic("learned")+" "+escapeHtml(t("learnedLabel"))+'</label><textarea id="entryLearned" placeholder="'+escapeHtml(t("learnedPlaceholder"))+'"></textarea>'
        + "<label>"+ic("homework")+" "+escapeHtml(t("homeworkLabel"))+'</label><textarea id="entryHomework" placeholder="'+escapeHtml(t("homeworkPlaceholder"))+'"></textarea>'
        + "<label>"+ic("score")+" "+escapeHtml(t("scoreLabel"))+'</label><input type="text" id="entryScore" placeholder="'+escapeHtml(t("scorePlaceholder"))+'">'
        + '<div class="toggle-row"><button type="button" class="toggle-switch'+(draftAttended?" on":"")+'" onclick="toggleDraftAttended()"><span class="knob"></span></button><span class="toggle-label">'+escapeHtml(t("attendedChip"))+"</span></div>"
        + '<div class="toggle-row"><button type="button" class="toggle-switch'+(draftHomeworkDone?" on":"")+'" onclick="toggleDraftHomeworkDone()"><span class="knob"></span></button><span class="toggle-label">'+escapeHtml(t("homeworkDoneChip"))+"</span></div>"
        + '<button class="btn-save" type="button" onclick="saveEntry(\''+activeDay+'\')">'+escapeHtml(t("save"))+"</button>"
      + "</div>"
      + '<h3 class="history-title">'+escapeHtml(t("entriesHistory"))+"</h3>"
      + '<div class="entries-list">'+entriesHtml+"</div>";
  }

  function statCard(iconName, label, value, sub){
    return '<div class="stat-card"><div class="stat-emoji">'+ic(iconName)+'</div><div class="stat-label">'+escapeHtml(label)+'</div><div class="stat-value">'+escapeHtml(value)+"</div>"
      + (sub ? '<div class="stat-sub">'+escapeHtml(sub)+"</div>" : "")
      + "</div>";
  }

  window.setProgressPeriod = function(p){
    progressPeriod = p;
    renderProgressPanel();
  };

  function renderProgressPanel(){
    var panel = document.getElementById("dayPanel");
    panel.setAttribute("data-theme", "progress");

    var periods = ["week","month","all"];
    var periodKeys = {week:"periodWeek", month:"periodMonth", all:"periodAll"};
    var periodBtns = "";
    for(var i=0;i<periods.length;i++){
      var p = periods[i];
      periodBtns += '<button type="button" class="period-btn'+(progressPeriod===p?" active":"")+'" onclick="setProgressPeriod(\''+p+'\')">'+escapeHtml(t(periodKeys[p]))+"</button>";
    }

    var stats = computeStats(progressPeriod);
    var body;
    if(!stats || stats.empty){
      body = '<p class="no-entries" style="position:relative;margin-top:.5rem;">'+escapeHtml(t("progressEmpty"))+"</p>";
    } else {
      var avgDisplay = stats.avgScore !== null ? stats.avgScore+"%" : "\u2014";
      var avgSub = stats.scoredCount ? t("scoredEntriesNote").replace("{n}", stats.scoredCount) : "";
      var attDisplay = stats.attendedPct+"%";
      var attSub = stats.attendedCount+"/"+stats.total;
      var classesDisplay = stats.attendedCount+"/"+stats.expected;
      var hwDisplay = stats.hwTotal ? (stats.hwDone+"/"+stats.hwTotal) : "\u2014";

      body = '<div class="stats-grid">'
        + statCard("score", t("avgScoreLabel"), avgDisplay, avgSub)
        + statCard("attend", t("attendanceLabel"), attDisplay, attSub)
        + statCard("calendar", t("classesLabel"), classesDisplay, "")
        + statCard("homework", t("homeworkDoneLabel"), hwDisplay, "")
        + "</div>";
    }

    panel.innerHTML =
      '<div class="panel-icon">'+WATERMARK_ICON+"</div>"
      + '<div class="panel-header"><h2>'+escapeHtml(t("progressTitle"))+"</h2></div>"
      + '<div class="period-toggle">'+periodBtns+"</div>"
      + body;
  }

  function renderAll(){
    renderStatic();
    renderLangButtons();
    renderRestBanner();
    renderTabs();
    if(activeView === "progress"){ renderProgressPanel(); } else { renderPanel(); }
  }

  function switchLang(newLang){
    lang = newLang;
    localStorage.setItem("scheduleLang", lang);
    withDraftPreserved(renderAll);
  }

  var langBtns = document.querySelectorAll(".lang-switch button");
  for(var i=0;i<langBtns.length;i++){
    langBtns[i].addEventListener("click", function(){
      switchLang(this.getAttribute("data-lang"));
    });
  }

  document.getElementById("exportBtn").addEventListener("click", function(){
    var data = { entries: getEntries(), lang: lang, exportedAt: todayISO() };
    var blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "dars-jadvali-backup.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById("importInput").addEventListener("change", function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        if(data.entries) setEntries(data.entries);
        if(data.lang && I18N[data.lang]) {
          lang = data.lang;
          localStorage.setItem("scheduleLang", lang);
        }
        renderAll();
        showToast(t("importedToast"));
      }catch(err){
        alert(t("importError"));
      }
      e.target.value = "";
    };
    reader.readAsText(file);
  });

  renderAll();
})();
